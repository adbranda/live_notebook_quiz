<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Join | Notebook Live Quiz</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" id="joinCard">
        <div class="eyebrow">PLAYER</div>
        <h1>Join game</h1>
        <form id="joinForm">
          <label
            >Game PIN<input
              id="pinInput"
              inputmode="numeric"
              maxlength="6"
              placeholder="123456"
              required /></label
          ><label
            >Nickname<input
              id="nameInput"
              maxlength="24"
              autocomplete="nickname"
              required /></label
          ><button class="button primary" type="submit">Join</button>
        </form>
        <p id="error" class="error"></p>
      </section>
      <section id="playerGame" class="hidden"></section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/join.js"></script>
  </body>
</html>
