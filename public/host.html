<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host | Notebook Live Quiz</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell wide"><section id="setup" class="card"><div class="eyebrow">HOST</div><h1>Create a game</h1><form id="createForm"><label>Quiz CSV<input id="file" type="file" accept=".csv,text/csv" required></label><label>Seconds per question<input id="time" type="number" min="5" max="120" value="20"></label><button class="button primary" type="submit">Create game</button></form><p id="error" class="error"></p></section><section id="game" class="hidden"><div class="topbar"><div><div class="eyebrow">GAME PIN</div><div id="pin" class="pin"></div></div><div><strong id="title"></strong><div id="progress" class="muted"></div></div></div><div id="hostContent"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/host.js"></script></body></html>
